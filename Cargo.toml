[package]
name = "lognav"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "A fast, keyboard-driven terminal log viewer for any log format"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Feho/LogNav"
homepage = "https://github.com/Feho/LogNav"
readme = "README.md"
keywords = ["tui", "log", "viewer", "logs", "terminal"]
categories = ["command-line-utilities"]
exclude = ["demo.gif", "demo-stats.png", "*.log", "scripts/"]

[dependencies]
arboard = "3.4"
chrono = "0.4.43"
crossterm = "0.29.0"
directories = "6.0.0"
fuzzy-matcher = "0.3.7"
notify = "8.2.0"
ratatui = "0.30.0"
rayon = "1.10"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "0.8"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7"
log = "0.4"
simplelog = "0.12"
time = { version = "0.3", features = ["macros"] }
self_update = { version = "0.41", default-features = false, features = ["rustls", "archive-tar", "archive-zip", "compression-flate2", "compression-zip-deflate"] }
